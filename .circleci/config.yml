version: 2.1

orbs:
  snyk: snyk/snyk@1.1.2

references:
  container: &container
    docker:
      - image: cimg/node:24.16.0-browsers
        environment:
          CHROME_PATH: $(which google-chrome-stable)

  restore_deps: &restore_deps
    restore_cache:
      keys:
        - v2-uswds-dependencies-{{ checksum "package-lock.json" }}

jobs:
  build:
    <<: *container
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-uswds-dependencies-{{ checksum "package-lock.json" }}
      - run: npm install
      - run: npx playwright install
      - save_cache:
          paths:
            - node_modules
          key: v2-uswds-dependencies-{{ checksum "package-lock.json" }}
      - snyk/scan:
          organization: uswds
      - run:
          name: Run test
          command: npm run test:ci
      - run:
          name: Check formatting
          command: npm run prettier:check

workflows:
  version: 2
  circle-uswds:
    jobs:
      - build

