<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combo box validation states</title><link rel="stylesheet" href="dist/css/uswds.css"><style>body{font-family:Arial,sans-serif;padding:32px;color:#1b1b1b}main{max-width:720px}h1{font-size:28px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}p{font-size:16px;line-height:1.5}section{margin:28px 0}.usa-label{margin-top:8px}</style></head><body><main><h1>Combo box validation states</h1><p>Existing validation classes on the select should remain visible after enhancement.</p><section><h2>Error state</h2><label class="usa-label" for="fruit-error">Select a fruit (error)</label><div class="usa-combo-box"><select id="fruit-error" name="fruit-error" class="usa-select usa-input--error custom-select"><option value="">Select a fruit</option><option value="apple">Apple</option><option value="apricot">Apricot</option><option value="banana">Banana</option></select></div></section><section><h2>Success state</h2><label class="usa-label" for="fruit-success">Select a fruit (success)</label><div class="usa-combo-box"><select id="fruit-success" name="fruit-success" class="usa-select usa-input--success custom-select"><option value="">Select a fruit</option><option value="apple">Apple</option><option value="apricot">Apricot</option><option value="banana">Banana</option></select></div></section><section><h2>Default state</h2><label class="usa-label" for="fruit-default">Select a fruit (default)</label><div class="usa-combo-box"><select id="fruit-default" name="fruit-default" class="usa-select custom-select"><option value="">Select a fruit</option><option value="apple">Apple</option><option value="apricot">Apricot</option><option value="banana">Banana</option></select></div></section></main><script src="before.js"></script></body></html>
