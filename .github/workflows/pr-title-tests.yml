name: Title validator tests

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Title validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Exercise proposed validator changes without granting write permissions.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - name: Test proposed title validation
        run: node --test .github/scripts/check-pr-title.test.mjs
