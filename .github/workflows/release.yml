name: Publish Package to npmjs
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the reviewed version commit merged into develop
        required: true
        type: string
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]
      publish:
        description: Publish after full verification (false performs a dry run)
        type: boolean
        default: false
      confirm_version:
        description: Exact package version, required when publishing
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: uswds-release
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.policy.outputs.source }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: policy
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        run: node scripts/authorize-release.mjs
  verify:
    needs: authorize
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.authorize.outputs.source }}
      full: true
  audit:
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.18.0 --ignore-scripts --no-audit --fund=false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: release-artifacts
          merge-multiple: true
      - name: Check shipped dependency vulnerabilities
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: node scripts/release-audit.mjs
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-dependency-audit
          path: release-artifacts/audit.json
          retention-days: 14
      - name: Summarize verified candidate
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          SOURCE: ${{ needs.authorize.outputs.source }}
        run: |
          echo "Verified USWDS $VERSION at $SOURCE. The verified-package artifact contains the tested tarball and checksums." >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: ${{ inputs.publish }}
    needs: [authorize, verify, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0 --ignore-scripts --no-audit --fund=false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: release-artifacts
          merge-multiple: true
      - name: Publish the verified bytes
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        run: node scripts/publish-verified.mjs
  registry-smoke:
    needs: [authorize, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify registry installation
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: npm run test:package -- "@uswds/uswds@$VERSION"
  record:
    needs: [authorize, verify, registry-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: release-artifacts
          merge-multiple: true
      - name: Record tag, notes, and assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        run: node scripts/record-release.mjs
