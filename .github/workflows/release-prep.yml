name: Prepare release
on:
  push:
    branches: [develop]
    paths: [".changeset/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: version-pr
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'uswds/uswds' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Apply pending release notes
        run: |
          npx --no-install changeset version
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Create or update version PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          sign-commits: true
          branch: automation/version-packages
          base: develop
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
            .changeset/
          commit-message: "chore(release): version package"
          title: "chore(release): version package"
          body: |
            Applies pending changesets to the package version and changelog.
            Review and merge manually. Merging does not publish a package.
            Publication requires the manual release workflow described in docs/releasing.md.
      - name: Verify the generated branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml --ref automation/version-packages
          gh workflow run pr-title.yml --ref automation/version-packages -f "pull_request_number=$PR_NUMBER"
