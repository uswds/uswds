name: Feature Request 💡
description: Request a concrete enhancement to existing USWDS functionality.
title: "USWDS - Feature: [YOUR TITLE]"
labels: ["Type: Feature Request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a concrete enhancement to existing USWDS functionality. Describe the problem and the behavior you want to change.

        For usage questions, [ask in Q&A](https://github.com/uswds/uswds/discussions/new?category=q-a). Explore early suggestions in [Ideas](https://github.com/uswds/uswds/discussions/new?category=ideas), and suggest new components or patterns in [Proposals](https://github.com/uswds/uswds/discussions/new?category=proposals).
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: "Provide a clear and concise description of what the problem is. Ex. I'm always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "Provide a clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "Provide a clear and concise description of any alternative solutions or features you've considered."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Add any other context or screenshots about the feature request."
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: Please confirm the following
      options:
        - label: I agree to follow this project's [Code of
            Conduct](https://designsystem.digital.gov/about/community/#community-conduct).
          required: true
        - label: I checked the [current
            issues](https://github.com/uswds/uswds/issues?q=is%3Aissue+is%3Aopen+label%3A%22Type%3A+Feature+Request%22) for
            duplicate feature requests.
          required: true
