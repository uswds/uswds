<form class="usa-form">
  <input
    id="usa-range"
    class="usa-range"
    type="range"
    min="20"
    max="100"
    step="10"
    value="20"
    data-text-unit="percent"
    aria-describedby="range-hint"
  >
  <span class="usa-hint" id="range-hint">Move the slider to change the value</span>
</form>
